version: '3.9'

services:

    fuseki:
        build: ./fuseki
        container_name: hascoapi_fuseki
        ports:
            - "3030:3030"
        networks:
            hascoapi:
                aliases:
                    - fuseki
        volumes:
            - hascoapi-fuseki-data:/fuseki/databases
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:3030/$$/ping || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s
        restart: always

    fuseki-yasgui:
        build: ./fuseki-yasgui
        container_name: hascoapi_fuseki_yasgui
        ports:
            - "8888:8888"
        networks:
            hascoapi:
                aliases:
                    - fuseki-yasgui
        environment:
            DEFAULT_SPARQL_ENDPOINT: "http://localhost:3030/store/sparql"  # Corrigido
        depends_on:
            fuseki:
                condition: service_healthy
    
    hascoapi:
        build:
            context: .
            dockerfile: Dockerfile
        stdin_open: true    
        tty: true
        ports:
            - "9001:9001"
        environment:
            JAVA_OPTS: "-Xms128m -Xmx12g"
            FUSEKI_URL: "http://fuseki:3030"
            R_SCRIPT_BIN: "/usr/bin/Rscript"
        volumes:
            - /var/log/hascoapi:/hascoapi/logs
            - hascoapi-resources:/var/hascoapi/resources
            - hascoapi-media:/var/hascoapi/media
        depends_on:
            fuseki:
                condition: service_healthy
        networks:
            hascoapi:
                aliases:
                    - hascoapi
        restart: always

volumes:
    hascoapi-fuseki-data:
    hascoapi-resources:
    hascoapi-media:

networks:
    hascoapi:
