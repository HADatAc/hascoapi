version: '3'

services:

    fuseki:
        build: ./fuseki
        container_name: hascoapi_fuseki
        ports:
            - "3030:3030"
        networks:
            hascoapi:
                aliases:
                    - fuseki
        volumes:
            - hascoapi-fuseki-data:/fuseki/databases
        restart: always
    
volumes:
    hascoapi-fuseki-data:

networks:
    hascoapi:
