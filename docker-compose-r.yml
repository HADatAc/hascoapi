services:

    fuseki:
        build: ./fuseki
        container_name: hascoapi_fuseki
        ports:
            - "3030:3030"
        networks:
            hascoapi:
                aliases:
                    - fuseki
        volumes:
            - hascoapi-fuseki-data:/fuseki/databases
        restart: always

    fuseki-yasgui:
        build: ./fuseki-yasgui
        container_name: hascoapi_fuseki_yasgui
        ports:
            - "8888:8888"
        networks:
            hascoapi:
                aliases:
                    - fuseki-yasgui
        environment:
            DEFAULT_SPARQL_ENDPOINT: "http://localhost:3030/store/sparql"
        depends_on:
            - fuseki

    hascoapi:
        build:
            context: https://github.com/HADatAc/hascoapi.git#DEV_V0.9.6
            dockerfile: Dockerfile
        ports:
            - "9001:9001"
        environment:
            JAVA_OPTS: "-Xms128m -Xmx7372m"
            FUSEKI_URL: "http://fuseki:3030"
            R_SCRIPT_BIN: "/usr/bin/Rscript"
            R_ENGINE_URL: "http://r-engine:8000"
            R_ENGINE_TIMEOUT_SECONDS: "300"
            R_ENGINE_ARTIFACT_ROOT: "/var/hascoapi/r-engine/output"
        volumes:
            - /var/data/hascoapi/logs:/hascoapi/logs
            - hascoapi-resources:/var/hascoapi/resources
            - hascoapi-media:/var/hascoapi/media
            - hascoapi-r-engine-work:/var/hascoapi/r-engine
        depends_on:
            - fuseki
            - r-engine
        networks:
            hascoapi:
                aliases:
                    - hascoapi
        restart: always

    r-engine:
        build: ./r-engine
        container_name: hascoapi_r_engine
        ports:
            - "3031:8000"
        networks:
            hascoapi:
                aliases:
                    - r-engine
        environment:
            FUSEKI_SPARQL_ENDPOINT: "http://fuseki:3030/store/sparql"
            R_ENGINE_WORKDIR: "/work"
            R_ENGINE_OUTPUT_DIR: "/work/output"
        volumes:
            - hascoapi-r-engine-work:/work
            - ./r-engine/examples:/opt/r-engine/examples:ro
        depends_on:
            - fuseki
        restart: always

volumes:
    hascoapi-fuseki-data:
    hascoapi-resources:
    hascoapi-media:
    hascoapi-r-engine-work:

networks:
    hascoapi:
