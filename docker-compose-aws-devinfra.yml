version: '3'

services:
    fuseki:
        build:
            context: ./fuseki
            dockerfile: Dockerfile
        container_name: hascoapi_fuseki
        ports:
            - "3030:3030"
        networks:
            hascoapi:
                aliases:
                    - fuseki
        volumes:
            - /var/data/hascoapi/fuseki-data:/fuseki/databases
        environment:
            - TMPDIR=/var/data/tmp
        tmpfs:
            - /tmp:size=100M,exec
        restart: always

    fuseki-yasgui:
        build:
            context: ./fuseki-yasgui
            dockerfile: Dockerfile
        container_name: hascoapi_fuseki_yasgui
        ports:
            - "8888:8888"
        networks:
            hascoapi:
                aliases:
                    - fuseki-yasgui
        environment:
            DEFAULT_SPARQL_ENDPOINT: "http://localhost:3030/store/sparql"
            TMPDIR: /var/data/tmp
        tmpfs:
            - /tmp:size=100M,exec
        depends_on:
            - fuseki
        restart: always
    
    hascoapi:
        build:
            context: .
            dockerfile: Dockerfile.aws-devinfra
        container_name: hascoapi
        stdin_open: true    
        tty: true
        ports:
            - "9001:9000"
        environment:
            JAVA_OPTS: "-Xms128m -Xmx2560m -Djava.io.tmpdir=/var/data/tmp"
            FUSEKI_URL: "http://fuseki:3030"
            TMPDIR: /var/data/tmp
        volumes:
            - /var/data/hascoapi/logs:/hascoapi/logs
            - /var/data/tmp:/var/data/tmp
        tmpfs:
            - /tmp:size=500M,exec
        depends_on:
            - fuseki
        networks:
            hascoapi:
                aliases:
                    - hascoapi
        restart: always

networks:
    hascoapi:
