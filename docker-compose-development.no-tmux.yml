services:

  fuseki:
    build: ./fuseki
    container_name: hascoapi_fuseki
    ports:
      - "3030:3030"
    networks:
      hascoapi:
        aliases:
          - fuseki
    volumes:
      - hascoapi-fuseki-data:/fuseki/databases
    restart: always

  fuseki-yasgui:
    build: ./fuseki-yasgui
    container_name: hascoapi_fuseki_yasgui
    ports:
      - "8888:8888"
    networks:
      hascoapi:
        aliases:
          - fuseki-yasgui
    environment:
      - DEFAULT_SPARQL_ENDPOINT=http://localhost:3030/store/sparql
    depends_on:
      - fuseki

  hascoapi:
    build:
      context: .
      dockerfile: Dockerfile-development.no-tmux
    stdin_open: true
    tty: true
    ports:
      - "9001:9000"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx2560m"
      SBT_UPDATE_RETRY_SECONDS: "90"
    volumes:
      - /var/log/hascoapi:/hascoapi/logs
      - hascoapi-sbt-cache:/root/.sbt
      - hascoapi-ivy2-cache:/root/.ivy2
      - hascoapi-m2-cache:/root/.m2
      - hascoapi-coursier-cache:/root/.cache/coursier
    depends_on:
      - fuseki
    networks:
      hascoapi:
        aliases:
          - hascoapi
    restart: always

volumes:
  hascoapi-fuseki-data:
  hascoapi-sbt-cache:
  hascoapi-ivy2-cache:
  hascoapi-m2-cache:
  hascoapi-coursier-cache:

networks:
  hascoapi:
