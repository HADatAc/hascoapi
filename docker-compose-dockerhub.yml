version: '3'

# Docker Hub Public Images - NO credentials needed to pull
# Replace {DOCKERHUB_USERNAME} with your Docker Hub username

services:

    fuseki:
        image: {DOCKERHUB_USERNAME}/hascoapi-fuseki:latest
        container_name: hascoapi_fuseki
        ports:
            - "3030:3030"
        networks:
            hascoapi:
                aliases:
                    - fuseki
        volumes:
            - hascoapi-fuseki-data:/fuseki/databases
        restart: always

    fuseki-yasgui:
        image: {DOCKERHUB_USERNAME}/hascoapi-fuseki-yasgui:latest
        container_name: hascoapi_fuseki_yasgui
        ports:
            - "8888:8888"
        networks:
            hascoapi:
                aliases:
                    - fuseki-yasgui
        environment:
            DEFAULT_SPARQL_ENDPOINT: "http://localhost:3030/store/sparql"
        depends_on:
            - fuseki
        restart: always
    
    hascoapi:
        image: {DOCKERHUB_USERNAME}/hascoapi:latest
        stdin_open: true    
        tty: true
        ports:
            - "9001:9001"
        environment:
            JAVA_OPTS: "-Xms128m -Xmx12g"
            FUSEKI_URL: "http://fuseki:3030"
        volumes:
            - /var/log/hascoapi:/hascoapi/logs
        depends_on:
            - fuseki
        networks:
            hascoapi:
                aliases:
                    - hascoapi
        restart: always

volumes:
    hascoapi-fuseki-data:

networks:
    hascoapi:
